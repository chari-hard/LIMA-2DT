<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Informações de Contato</legend>

            <label for="input-nome">Nome:</label>
            <input type="text" name="nome" id="input-nome" placeholder="Insira seu nome" required>
            
            <br>
            
            <label for="input-email">Email:</label>
            <input type="email" name="email" id="input-email" placeholder="Insira seu email" required>
            
            <br>

            <label for="input-senha">Senha:</label>
            <input type="password" name="senha" id="input-senha" placeholder="Insira sua senha" required>
            
            <br>

            <label for="input-data">Data de Nascimento:</label>
            <input type="date" name="input-data" id="input-data" required>
            
            <br>

            <button type="submit">Enviar</button>
        </fieldset>

        <fieldset>
            <legend>Prfeferências</legend>

            <p>Informe sua cor preferida:</p>
            <label><input type="radio" name="cor">Azul</label>
            <label><input type="radio" name="cor">Vermelho</label>
            
            <p>Informe quais frutas você quer:</p>
            <label><input type="checkbox" name="fruta">Maçã</label>
            <label><input type="checkbox" name="fruta">Banana</label>

            <br>

            <p>Insira seu idioma:</p>
            <label for="idioma">Idioma:</label>
            <select name="idioma" id="idioma">
                <option value="" disabled selected>Selecione uma opção</option>
                <option value="pt">Português</option>
                <option value="en">Inglês</option>
            </select>

            <br>
            <br>

            <label for="sugestoes">Sugestões:</label>
            <textarea name="area de textop" id="sugestoes"></textarea>
        </fieldset>
    </form>
</body>
</html>
